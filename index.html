<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Real-Time Chat Application</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Username Screen -->
    <div id="usernameScreen" class="username-screen">

        <div class="login-box">

            <div class="logo">
                💬
            </div>

            <h1>Real-Time Chat</h1>

            <p>Enter your name to join the conversation</p>

            <input
                type="text"
                id="usernameInput"
                placeholder="Enter your username"
                maxlength="20"
                autocomplete="off"
            >

            <button id="joinButton">
                Join Chat
            </button>

            <p id="errorMessage" class="error"></p>

        </div>

    </div>


    <!-- Chat Application -->
    <div id="chatApp" class="chat-app hidden">

        <!-- Header -->
        <header class="chat-header">

            <div class="header-left">

                <div class="chat-logo">
                    💬
                </div>

                <div>
                    <h2>Real-Time Chat</h2>

                    <span>
                        <span class="online-dot"></span>
                        <span id="onlineCount">0</span> online
                    </span>
                </div>

            </div>

            <button id="clearButton" class="clear-button">
                Clear Chat
            </button>

        </header>


        <!-- Main Content -->
        <div class="chat-container">

            <!-- Users Sidebar -->
            <aside class="users-panel">

                <h3>Online Users</h3>

                <div id="usersList">
                    <!-- Users will appear here -->
                </div>

            </aside>


            <!-- Chat Area -->
            <main class="chat-area">

                <!-- Messages -->
                <div id="messages" class="messages">

                    <div class="empty-message">
                        <div>💬</div>
                        <h3>Welcome to the chat!</h3>
                        <p>Start a conversation with other users.</p>
                    </div>

                </div>


                <!-- Typing Indicator -->
                <div id="typingIndicator" class="typing-indicator">
                </div>


                <!-- Message Input -->
                <div class="message-area">

                    <input
                        type="text"
                        id="messageInput"
                        placeholder="Type your message..."
                        autocomplete="off"
                    >

                    <button id="sendButton">
                        Send ➤
                    </button>

                </div>

            </main>

        </div>

    </div>


    <!-- Socket.IO -->
    <script src="/socket.io/socket.io.js"></script>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
